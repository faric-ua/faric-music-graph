name: Validate

on:
  push:
  pull_request:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python -B scripts/validate_repo.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check app/app.js
          node --check app/sample-data.js
          node --check app/prototype-fixtures.js
          node --check app/graph-state.js
          node --check app/graph-projection.js
          node --check app/account-model.js
          node --check app/filter-model.js
          node --check app/node-controls.js
          node --check app/navigation-ui.js
          node --check app/nested-world-model.js
          node --check app/track-details.js
          node --check app/session-persistence.js
          node --check scripts/test_graph_state.js
          node --check scripts/test_graph_projection.js
          node --check scripts/test_account_model.js
          node --check scripts/test_filter_panel.js
          node --check scripts/test_node_controls.js
          node --check scripts/test_navigation_ui.js
          node --check scripts/test_nested_world.js
          node --check scripts/test_track_details.js
          node --check scripts/test_session_restoration.js
      - name: Graph state tests
        run: node scripts/test_graph_state.js
      - name: Projection engine tests
        run: node scripts/test_graph_projection.js
      - name: Account model tests
        run: node scripts/test_account_model.js
      - name: Adaptive filter panel tests
        run: node scripts/test_filter_panel.js
      - name: Node-control palette tests
        run: node scripts/test_node_controls.js
      - name: Breadcrumb navigation tests
        run: node scripts/test_navigation_ui.js
      - name: Canonical nested drill tests
        run: node scripts/test_nested_world.js
      - name: Structured Track detail tests
        run: node scripts/test_track_details.js
      - name: Semantic session restoration tests
        run: node scripts/test_session_restoration.js
      - name: Git whitespace check
        run: git diff --check HEAD^ HEAD || git diff --check
