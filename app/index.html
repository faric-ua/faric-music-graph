<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>FARIC Music Graph</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <div class="brand">
      <strong>FARIC Music Graph</strong>
      <span>v0.2.0 Nested 3D Worlds</span>
    </div>
    <div class="header-actions">
      <button
        id="filterToggle"
        class="filter-toggle"
        type="button"
        aria-controls="filters"
        aria-expanded="false"
      >
        <span>Фільтри</span>
        <span id="filterBadge" class="filter-badge" hidden>0</span>
        <span id="filterPending" class="filter-pending" aria-label="Є незастосовані зміни" hidden>•</span>
      </button>
    </div>
  </header>

  <button id="filterScrim" class="filter-scrim" type="button" aria-label="Закрити фільтри"></button>

  <aside id="filters" class="filter-panel" aria-hidden="true">
    <div class="filter-panel-header">
      <div>
        <strong>ФІЛЬТРИ</strong>
        <small>Зміни набудуть сили після «Застосувати»</small>
      </div>
      <button id="filterClose" class="icon-button" type="button" aria-label="Закрити фільтри">×</button>
    </div>

    <div class="filter-panel-body">
      <section class="filter-section" aria-label="Фільтри графа">
        <label>Пошук
          <input id="search" type="search" placeholder="трек, альбом, виконавець">
        </label>

        <label>Виконавець
          <select id="artist"><option value="all">Усі</option></select>
        </label>

        <label>Рік
          <span class="filter-range">
            <input id="yearMin" type="number" inputmode="numeric" placeholder="від" aria-label="Рік від">
            <span aria-hidden="true">—</span>
            <input id="yearMax" type="number" inputmode="numeric" placeholder="до" aria-label="Рік до">
          </span>
        </label>

        <label>Жанр
          <select id="genre"><option value="all">Усі</option></select>
        </label>

        <label>Тип релізу
          <select id="releaseType"><option value="all">Усі</option></select>
        </label>
      </section>

      <section class="filter-section prototype-section" aria-label="Налаштування прототипу">
        <h2>Відображення прототипу</h2>

        <label>Вид графа
          <select id="view">
            <option value="map">2D Map</option>
            <option value="sphere">Sphere 3D</option>
          </select>
        </label>

        <label>Структура
          <select id="structure">
            <option value="artist">Виконавець → реліз → трек</option>
            <option value="year">Рік → жанр → виконавець</option>
          </select>
        </label>
      </section>

      <div id="stats"></div>
      <p class="note">
        1 палець: панорама / обертання · 2 пальці: масштаб · tap: деталі
      </p>
    </div>

    <footer class="filter-panel-footer">
      <button id="resetFilters" type="button">Скинути</button>
      <button id="applyFilters" class="primary-action" type="button" disabled>Застосувати</button>
    </footer>
  </aside>

  <main>
    <canvas id="graph" aria-label="Music graph"></canvas>

    <div id="viewBadge">2D Map</div>

    <div id="nodeControls" class="node-controls" aria-label="Керування вузлами">
      <div class="node-control-group" aria-label="Видимість">
        <button id="expandAll" type="button" aria-label="Розгорнути всі вузли">+ all</button>
        <button id="collapseAll" type="button" aria-label="Згорнути всі вузли">− all</button>
        <button id="expandNode" type="button" aria-label="Розгорнути вибраний вузол">+ node</button>
        <button id="collapseNode" type="button" aria-label="Згорнути вибраний вузол">− node</button>
      </div>
      <div class="node-control-group" aria-label="Навігація">
        <button id="backScope" type="button" aria-label="Назад">←</button>
        <button id="enterNode" type="button" aria-label="Увійти у вибраний вузол">→</button>
        <button id="homeScope" type="button" aria-label="До Universe">Home</button>
        <button id="fit" type="button" aria-label="Вмістити граф">Fit</button>
      </div>
      <div id="nodeControlStatus" class="node-control-status">Universe</div>
    </div>

    <div id="zoomControls" class="zoom-controls" aria-label="Масштаб">
      <button id="zoomIn" type="button" aria-label="Збільшити">+</button>
      <button id="zoomOut" type="button" aria-label="Зменшити">−</button>
    </div>

    <section id="inspector" aria-live="polite">
      <button id="close" type="button" aria-label="Закрити">×</button>
      <div id="details"></div>
    </section>
  </main>

  <script src="sample-data.js"></script>
  <script src="graph-state.js"></script>
  <script src="filter-model.js"></script>
  <script src="node-controls.js"></script>
  <script src="app.js"></script>
</body>
</html>
